<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasiga Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--line:#d9dfe8;--fg:#141b27;--muted:#5d6b80;--accent:#2f4bd8;--accent-fg:#fff;--up:#0f8a4b;--saffron:#e8801a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1017;--surface:#141a24;--line:#273041;--fg:#e7ecf4;--muted:#8d9bb1;--accent:#7b93ff;--accent-fg:#0c1017;--up:#35c17b;--saffron:#f0983c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Hanken Grotesk',system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px 28px;text-align:center}
.logo{width:76px;height:76px;object-fit:contain;margin:0 auto 14px;display:block}
.kic{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--saffron);text-transform:uppercase}
h1{margin:8px 0 10px;font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:.02em;font-weight:800}
p{margin:0 0 22px;color:var(--muted);font-size:16px;line-height:1.5}
.stats{display:flex;gap:10px;justify-content:center;margin:0 0 26px;flex-wrap:wrap}
.stats span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.play{display:block;width:100%;padding:16px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font:inherit;font-size:18px;font-weight:700;text-decoration:none}
.play:hover{filter:brightness(1.08)}
.play:focus-visible,.adm:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.note{margin:14px 0 0;font-size:13px;color:var(--muted)}
footer{padding:16px;text-align:center}
.adm{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:inline-block}
.adm:hover{color:var(--fg)}
</style></head><body>
